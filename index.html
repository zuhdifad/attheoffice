<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#14171f" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2314171f'/%3E%3Crect x='4' y='6' width='24' height='4' fill='%23c08a4e'/%3E%3Crect x='6' y='14' width='9' height='12' fill='%231f7f8c'/%3E%3Crect x='18' y='14' width='8' height='12' fill='%23f2b134'/%3E%3C/svg%3E" />
  <title>At the Office</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- ?v= is a cache key: bump it when the sheet or the modules change, or the
       browser will happily keep serving the copy it already has. -->
  <link rel="stylesheet" href="style.css?v=15" />
</head>
<body>

  <!-- One sound control, fixed above every screen, so it is reachable on the
       title card and in the middle of a shift alike. -->
  <div class="sound-dock">
    <button id="muteBtn" class="mute" type="button" aria-pressed="false" aria-label="Toggle sound">
      <span class="mute-icon" aria-hidden="true">🔊</span>
      <span class="mute-label">Sound on</span>
    </button>
  </div>

  <!-- ================= START ================= -->
  <!-- The whole title screen is the name and one prompt, the way a console
       boots: press start and the shift gets introduced. -->
  <main class="title-screen" id="titleScreen">
    <div class="boot-glow" aria-hidden="true"></div>
    <div class="boot-scan" aria-hidden="true"></div>

    <div class="boot">
      <h1 class="title" aria-label="At the Office">At the<i>Office</i></h1>

      <button id="clockInBtn" class="boot-prompt" type="button">
        <span class="boot-prompt-key" aria-hidden="true">Enter</span>
        <span>Press Enter to start</span>
      </button>

      <p id="loadStatus" class="load-status">Loading the floor…</p>
    </div>
  </main>

  <!-- ================= BOOT LOADING ================= -->
  <!-- The beat between the title card and the first question. It is decoration
       only, so it stays out of the accessibility tree until it is on. -->
  <div id="bootLoad" class="boot-load" aria-hidden="true">
    <div class="boot-load-inner">
      <p class="boot-load-word">FIGHTING</p>
      <div class="boot-load-bar"><i></i></div>
      <p class="boot-load-note">Clocking in…</p>
    </div>
  </div>

  <!-- ================= ENLIST ================= -->
  <!-- Two questions before the floor hands over a badge: a name, then a level. -->
  <div id="popup" class="popup">
    <div class="popup-content enlist">
      <section class="enlist-stage is-on" id="stageWho">
        <h2>Who are you?</h2>
        <form id="whoForm" class="who-form" autocomplete="off" novalidate>
          <input id="whoInput" class="who-input" type="text" name="who" maxlength="18"
                 placeholder="Type your name" autocomplete="off" spellcheck="false"
                 aria-label="Your name" />
          <button class="btn btn-primary wide" type="submit">Continue</button>
        </form>
        <p class="enlist-err" id="whoError" role="alert"></p>
      </section>

      <section class="enlist-stage" id="stageWhere">
        <h2>Where do you work?</h2>
        <div class="floor-pick" id="floorPick" role="group" aria-label="Level">
          <button class="floor-btn" data-floor="Level 6" type="button">
            <span class="floor-key" aria-hidden="true">1</span><b>Level 6</b>
          </button>
          <button class="floor-btn" data-floor="Level 22" type="button">
            <span class="floor-key" aria-hidden="true">2</span><b>Level 22</b>
          </button>
          <button class="floor-btn" data-floor="Level 7" type="button">
            <span class="floor-key" aria-hidden="true">3</span><b>Level 7</b>
          </button>
        </div>
        <button id="whereBack" class="back-link" type="button">← Back</button>
      </section>

      <section class="enlist-stage" id="stageSeat">
        <h2>Pick a seat</h2>
        <div id="seatPick" class="seat-pick" role="group" aria-label="Seat"></div>
        <button id="seatBack" class="back-link" type="button">← Back</button>
      </section>

      <section class="enlist-stage" id="stageRole">
        <h2>Pick your role</h2>
        <div id="rolePick" class="role-pick" role="group" aria-label="Role"></div>
        <button id="roleBack" class="back-link" type="button">← Back</button>
      </section>

      <section class="enlist-stage" id="stagePartner">
        <h2>Who will play with you?</h2>
        <form id="partnerForm" class="who-form" autocomplete="off" novalidate>
          <input id="partnerInput" class="who-input" type="email" name="partner" maxlength="64"
                 placeholder="Teammate's email" autocomplete="off" spellcheck="false"
                 aria-label="Teammate's email address" />
          <button class="btn btn-primary wide" type="submit">Continue</button>
        </form>
        <p class="enlist-err" id="partnerError" role="alert"></p>
        <button id="partnerBack" class="back-link" type="button">← Back</button>
      </section>
    </div>
  </div>

  <!-- ================= CHARACTER PICKER ================= -->
  <div id="characterSelectPopup" class="popup">
    <div class="popup-content picker">
      <div class="picker-head">
        <h2>Select your character</h2>
      </div>

      <div class="showcase">
        <button id="prevBtn" class="showcase-arrow prev" type="button" aria-label="Previous character">‹</button>
        <img id="charCardImg" class="showcase-card" src="assets/chars/zuhdi-card.png" alt="Selected character" />
        <button id="nextBtn" class="showcase-arrow next" type="button" aria-label="Next character">›</button>
      </div>

      <button id="confirmCharBtn" class="btn btn-primary wide" type="button">Clock-in</button>
    </div>
  </div>

  <!-- ================= GAME ================= -->
  <!-- The room is the whole screen. The clock, the date and the clocked-in chip
       are painted inside the picture, so nothing sits outside the box. -->
  <div id="gameArea" class="game-area" style="display: none;">
    <div id="stage" class="stage">
      <canvas id="gameCanvas" width="480" height="288"></canvas>

      <!-- The evening offer, should the 18:00 question be declined. -->
      <button id="clockOutBtn" class="btn btn-ghost clock-out-btn" type="button" hidden>Clock out</button>

      <div id="touchPad" class="touch-pad">
        <button class="pad up" data-dir="up" type="button" aria-label="Walk up">▲</button>
        <button class="pad left" data-dir="left" type="button" aria-label="Walk left">◀</button>
        <button class="pad right" data-dir="right" type="button" aria-label="Walk right">▶</button>
        <button class="pad down" data-dir="down" type="button" aria-label="Walk down">▼</button>
        <button id="touchBack" class="pad act-b" type="button">B</button>
        <button id="touchWork" class="pad act" type="button">A</button>
      </div>
    </div>
  </div>

  <!-- After 18:00 the floor asks, once, whether you are heading home. -->
  <div id="clockOutModal" class="clockout-modal" hidden>
    <div class="clockout-card">
      <div class="clockout-time" id="clockOutTime">18:00</div>
      <h2>clock-out?</h2>
      <p>The day is done. Head home?</p>
      <div class="clockout-actions">
        <button id="clockOutYes" class="btn btn-primary" type="button">yes, clock out</button>
        <button id="clockOutNo" class="btn btn-ghost" type="button">not yet</button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js?v=15"></script>
</body>
</html>
